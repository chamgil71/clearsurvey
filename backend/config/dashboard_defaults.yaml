# Survey Engine v2 — 대시보드 기본 설정 템플릿
#
# 이 파일은 조직 공통 대시보드 레이아웃을 정의합니다.
# export 시 자동으로 JSON에 포함되어 웹 대시보드의 기본값으로 사용됩니다.
#
# 우선순위:
#   projects/{project}/dashboard.json(프로젝트) > localStorage(개인) >
#   config/dashboard_defaults.yaml(조직 공통) > buildDefaultConfig(자동 감지)
#
# 이 파일을 편집하면 dashboard.json이 없는 모든 프로젝트에 적용됩니다.
# 프로젝트별 특성은 projects/{project}/dashboard.json에 작성하세요.

# ──────────────────────────────────────────────────────────────────────────────
# KPI 카드 기본 구성 (null → 데이터 타입 기반 자동 생성)
# ──────────────────────────────────────────────────────────────────────────────
# kpi:
#   - label: 총 응답수
#     type: total_rows
#   - label: 예시 값 카운트
#     type: count_value
#     col: 소속기관유형
#     value: 대학

# ──────────────────────────────────────────────────────────────────────────────
# 차트 기본 구성 (null → category 컬럼 기반 자동 생성)
# ──────────────────────────────────────────────────────────────────────────────
# charts:
#   - col: 소속기관유형
#     title: 기관유형별 분포
#     type: donut
#   - col: 소재지_시도
#     title: 지역별 분포
#     type: hbar

# ──────────────────────────────────────────────────────────────────────────────
# 목록 기본 구성 (null → 첫 8컬럼 자동 선택)
# ──────────────────────────────────────────────────────────────────────────────
# list:
#   visible_cols: []    # 비워두면 자동 선택
#   filter_cols: []     # 비워두면 category 컬럼 자동 선택
