# Survey Engine v2 — 공통 데이터 패턴 정의
#
# 각 프로젝트의 config.yaml에서 patterns_file로 참조합니다.
#   patterns_file: "../../config/patterns.yaml"
#
# 프로젝트별 override:
#   - address_parsing: config.yaml에 직접 address_parsing 섹션 작성 시 이 파일보다 우선
#   - company/phone/brn: 현재 전체 교체만 지원 (부분 override는 config.yaml 직접 작성)

# ──────────────────────────────────────────────────────────────────────────────
# 1. 주소 파싱 (address_parsing)
#    transform: address_sido / address_sigungu 사용 시 필요
# ──────────────────────────────────────────────────────────────────────────────
address_parsing:
  sido_patterns:
    - [서울, [서울특별시, 서울시, 서울]]
    - [부산, [부산광역시, 부산시, 부산]]
    - [대구, [대구광역시, 대구시, 대구]]
    - [인천, [인천광역시, 인천시, 인천]]
    - [광주, [광주광역시, 광주시, 광주]]
    - [대전, [대전광역시, 대전시, 대전]]
    - [울산, [울산광역시, 울산시, 울산]]
    - [세종, [세종특별자치시, 세종시, 세종]]
    - [경기, [경기도, 경기, 성남시, 수원시, 용인시, 안양시, 고양시,
              화성시, 안산시, 김포시, 구리시, 의정부시, 평택시, 시흥시]]
    - [강원, [강원특별자치도, 강원도, 강원]]
    - [충북, [충청북도, 충북]]
    - [충남, [충청남도, 충남, 당진시, 천안시]]
    - [전북, [전라북도, 전북특별자치도, 전북]]
    - [전남, [전라남도, 전남]]
    - [경북, [경상북도, 경북]]
    - [경남, [경상남도, 경남]]
    - [제주, [제주특별자치도, 제주도, 제주]]

  seoul_gu:
    - 강남구
    - 강동구
    - 강북구
    - 강서구
    - 관악구
    - 광진구
    - 구로구
    - 금천구
    - 노원구
    - 도봉구
    - 동대문구
    - 동작구
    - 마포구
    - 서대문구
    - 서초구
    - 성동구
    - 성북구
    - 송파구
    - 양천구
    - 영등포구
    - 용산구
    - 은평구
    - 종로구
    - 중구
    - 중랑구


# ──────────────────────────────────────────────────────────────────────────────
# 2. 회사명 정규화 (normalize_company)
#    법인형태 표기 패턴 목록
# ──────────────────────────────────────────────────────────────────────────────
company:
  # 접두/접미에 나오는 법인 명칭 (단어 단위)
  corp_forms:
    - 주식회사
    - 유한회사
    - 유한책임회사
    - 합자회사
    - 합명회사
    - 재단법인
    - 사단법인
    - 공익법인
    - 사회적협동조합
    - 협동조합
    - 영농조합법인

  # 특수문자 형태 (정규식 이스케이프 필요 없이 리터럴로 작성)
  symbol_forms:
    - '㈜'    # 주식회사 기호
    - '㈔'    # 사단법인 기호

  # 괄호+약어 형태 (내부적으로 정규식으로 변환됨)
  bracket_forms:
    - '\(주\)'
    - '\(유\)'
    - '\(재\)'
    - '\(사\)'
    - '\(합\)'
    - '（주）'
    - '（유）'

  # keep_corp_type=true 시 사용할 약어 매핑
  abbrevs:
    주식회사: '(주)'
    유한회사: '(유)'
    합자회사: '(합)'
    합명회사: '(합명)'
    유한책임회사: '(유한)'
    재단법인: '(재)'
    사단법인: '(사)'
    공익법인: '(공)'
    협동조합: '(협)'


# ──────────────────────────────────────────────────────────────────────────────
# 3. 전화번호 정규화 (normalize_phone)
# ──────────────────────────────────────────────────────────────────────────────
phone:
  # 국제 전화 prefix 제거 (82 → 0으로 변환)
  intl_prefix: '82'

  # 지역번호 → 자릿수 그룹 수
  #   2 = 02 스타일: 02-XXX(X)-XXXX
  #   3 = 031 스타일: 031-XXXX-XXXX
  area_codes:
    # 서울
    '02': 2
    # 경기·인천권
    '031': 3
    '032': 3
    # 강원
    '033': 3
    # 충남·세종·대전
    '041': 3
    '042': 3
    '043': 3
    '044': 3
    # 부산·경남·울산
    '051': 3
    '052': 3
    '055': 3
    # 대구·경북
    '053': 3
    '054': 3
    # 전북
    '063': 3
    # 광주·전남
    '061': 3
    '062': 3
    # 제주
    '064': 3
    # 이동통신
    '010': 3
    '011': 3
    '016': 3
    '017': 3
    '018': 3
    '019': 3
    # 인터넷전화·수신자부담
    '070': 3
    '080': 3
    '1588': 0   # 특번 (분리 없음)
    '1544': 0
    '1566': 0
    '1577': 0
    '1600': 0
    '1644': 0
    '1800': 0


# ──────────────────────────────────────────────────────────────────────────────
# 4. 사업자등록번호 (validate_brn)
# ──────────────────────────────────────────────────────────────────────────────
brn:
  # 국세청 검증 가중치 (변경 금지 — 법령 고정값)
  weights: [1, 3, 7, 1, 3, 7, 1, 3, 5]
  # 출력 구분자
  separator: '-'
  # 자릿수 그룹 (3-2-5)
  parts: [3, 2, 5]


# ──────────────────────────────────────────────────────────────────────────────
# 5. 날짜 파싱 (normalize_date)
#    패턴은 순서대로 시도됨
# ──────────────────────────────────────────────────────────────────────────────
date:
  output_format: 'YYYY-MM-DD'   # 참고용 표기 (내부는 %Y-%m-%d)
  # 지원 입력 포맷 예시:
  #   2026년 1월 15일  /  2026.01.15  /  2026-01-15  /  2026/01/15
  #   26-01-15  /  20260115  /  2026년 1월 (일 없으면 01일로 처리)


# ──────────────────────────────────────────────────────────────────────────────
# 6. 직책/직급 정규화 (norm_position)
#
# 형식: [표준이름, [인식대상 이름들...]]
#   - 리스트 순서 = 직급 우선순위 (0번 = 최고위, 향후 소팅에 활용)
#   - 첫 번째 항목이 표준 출력 이름
#   - 두 번째 항목 리스트: 원문·약어·동의어 (정확 일치 우선, 이후 부분 일치)
#   - 매핑 없는 값은 원본 그대로 반환
# ──────────────────────────────────────────────────────────────────────────────
position_patterns:
  # ── 대표·최고경영진 (우선순위 0~) ──────────────────
  - [회장,         [회장, 명예회장]]
  - [대표이사,     [대표이사, 대표, CEO, 사장, 공동대표, 공동대표이사]]
  - [부대표,       [부대표, 부대표이사, 공동대표]]
  # ── 기술·정보 임원 ─────────────────────────────────
  - [최고기술책임자, [최고기술책임자, CTO]]
  - [최고정보책임자, [최고정보책임자, CIO]]
  - [최고운영책임자, [최고운영책임자, COO]]
  # ── 연구직 ─────────────────────────────────────────
  - [수석연구원,   [수석연구원, 수석]]
  - [책임연구원,   [책임연구원, 책임]]
  - [선임연구원,   [선임연구원, 선임]]
  - [연구원,       [연구원]]
  # ── 관리직 ─────────────────────────────────────────
  - [본부장,       [본부장, 그룹장]]
  - [팀장,         [팀장, 실장, 센터장, 단장]]
  - [부장,         [부장]]
  - [차장,         [차장]]
  - [과장,         [과장]]
  - [대리,         [대리]]
  - [주임,         [주임]]
  - [사원,         [사원, 팀원, 직원]]
  - [인턴,         [인턴, 인턴십]]


# ──────────────────────────────────────────────────────────────────────────────
# 7. 수행부서 → 본부명 그룹화 (map_division)
#
# 형식: [본부명, [소속 팀/부서 이름들...]]
#   - 리스트 순서 = 본부 우선순위 (0번 = 최우선, 향후 소팅에 활용)
#   - 첫 번째 항목이 그룹(본부) 표준 이름
#   - 두 번째 항목 리스트: 이 본부에 속하는 팀/부서명
#   - 매핑 없는 팀명은 원본 그대로 반환
# ──────────────────────────────────────────────────────────────────────────────
division_patterns:
  - [AI본부,        [AI전략팀, AI인프라팀, AI인프라확충팀, 반도체AI팀, 디지털인프라팀]]
  - [디지털혁신본부, [AX원스톱지원센터 TF팀, 디지털혁신팀]]
  - [클라우드본부,   [클라우드팀, 클라우드사업팀]]
  - [공공혁신본부,   [공공혁신팀]]
  - [지역협력본부,   [지역협력팀]]
  - [그린IT본부,     [그린IT팀]]
  - [산학협력본부,   [산학협력센터, 산학협력팀]]
