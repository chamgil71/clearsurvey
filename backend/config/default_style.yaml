# default_style.yaml — 신규 프로젝트 생성 시 복사되는 기본 스타일 설정
# 각 프로젝트의 projects/{name}/style.yaml 로 복사됩니다.
# 프로젝트별로 수정하면 되며, 이 파일은 기본값입니다.

# ── 헤더 행 스타일 ──────────────────────────────────────────────────────────
header:
  font_size: 9
  bold: true
  font_name: Arial
  font_color: "FFFFFF"
  fill_color: "1F4E79"
  height: 20

# ── 데이터 행 스타일 ──────────────────────────────────────────────────────────
data:
  font_size: 9
  font_name: Arial
  row_height: 15

# ── 컬럼 기본 너비 ────────────────────────────────────────────────────────────
default_col_width: 16

# ── 교대 행 색상 ─────────────────────────────────────────────────────────────
zebra:
  enabled: false
  color: "F5F5F5"
