version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clearsurvey-backend
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    volumes:
      - ./projects:/app/projects
      - ./storage:/app/storage
      - ./web/public/data:/app/web/public/data
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: clearsurvey-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
