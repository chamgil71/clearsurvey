[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "survey-engine"
version = "2.0.0"
description = "범용 설문 통계 자동화 엔진"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pandas>=2.2",
]

[project.scripts]
survey = "main:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "mypy>=1.10", "ruff>=0.4"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.setuptools]
packages = ["app"]